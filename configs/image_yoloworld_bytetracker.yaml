setting:
  shared_memory_name: "exp_dummy"

source:
  type: "FolderImageSource"
  folder_path: assets/images
  fps: 30 
  pattern: "*.jpg"
  recursive: true
  sort: "natsort"
  loop: true
  start_index: 0

pipelines:
  - name: "DummyPipeline"
    enable: true
    gpu_id: 0
    
    detector:
      type: "YOLOWorldDetector"
      weights_path: assets/weights/yolv8s-world2.pt
      imgsz: 640
      iou: 0.7
      conf: 0.3
      classes: ["head","handbag","backpack"]
      
    tracker:
      type: "BYTETracker"
      track_thresh : 0.3
      match_thresh : 0.7
      track_buffer : 60
      crowd : false
      fps: 30

output:
  mode: "sync"
  target_fps: 30
  
  handlers:
    - type: "ScreenHandler"
      enable: true
      window_name: "MOT Monitor"
      view_width: 480
      view_height: 270
      draw_detections: true
      draw_tracks: true
      show_info: true
    - type: "FileLogHandler"
      enable: true
      output_dir: "./logs"
      filename: "tracking_data.csv"