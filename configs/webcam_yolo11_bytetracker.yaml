setting:
  shared_memory_name: "exp_dummy"

source:
  type: "WebcamSource"
  device_index: 0
  width: 1280
  height: 720
  fps: 30
  buffer_size: 60

pipelines:
  - name: "DummyPipeline"
    enable: true
    gpu_id: 0
    
    detector:
      type: "Yolo11Detector"
      weights_path: assets/weights/yolo11n.pt
      imgsz: 640
      iou: 0.7
      conf: 0.5
      classes: 0
      
    tracker:
      type: "BYTETracker"
      track_thresh : 0.5
      match_thresh : 0.8
      track_buffer : 30
      crowd : false
      fps: 30

output:
  mode: "sync"
  target_fps: 30
  
  handlers:
    - type: "ScreenHandler"
      enable: true
      window_name: "MOT Monitor"
      view_width: 480
      view_height: 270
      draw_detections: true
      draw_tracks: true
      show_info: true
    - type: "FileLogHandler"
      enable: true
      output_dir: "./logs"
      filename: "tracking_data.csv"