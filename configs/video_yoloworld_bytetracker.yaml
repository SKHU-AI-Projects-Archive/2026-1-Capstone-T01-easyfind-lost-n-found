setting:
  shared_memory_name: "exp_dummy"

source:
  type: "VideoSource"
  video_path: "assets/videos/fps30_output.mp4"
  loop: true

pipelines:
  - name: "DummyPipeline"
    enable: true
    gpu_id: 0
    
    detector:
      type: "YOLOWorldDetector"
      weights_path: assets/weights/yolov8s-worldv2.pt
      imgsz: 640
      iou: 0.7
      conf: 0.5
      classes: ["person", "purple handbag"]
      
    tracker:
      type: "BYTETracker"
      track_thresh : 0.5
      match_thresh : 0.8
      track_buffer : 30
      crowd : false
      fps: 30

output:
  mode: "sync"
  target_fps: 30
  
  handlers:
    - type: "ScreenHandler"
      enable: true
      window_name: "MOT Monitor"
      view_width: 480
      view_height: 270
      draw_detections: true
      draw_tracks: true
      show_info: true
    - type: "FileLogHandler"
      enable: true
      output_dir: "./logs"
      filename: "tracking_data.csv"