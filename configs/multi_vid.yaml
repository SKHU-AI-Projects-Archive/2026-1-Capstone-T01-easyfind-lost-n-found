setting:
  project_name: "Multi-Webcam-Separate-Windows"

sources:
  - id: "cam_0"
    type: "VideoSource"
    video_path: "assets/videos/fps30_output.mp4"
    shared_memory_name: "shm_cam_0"
    width: 640
    height: 480
    fps: 30
    buffer_size: 30
    loop : true

  - id: "cam_1"
    type: "VideoSource"
    video_path: "assets/videos/Venice-2.mp4"
    shared_memory_name: "shm_cam_1"
    width: 640
    height: 480
    fps: 30
    buffer_size: 30
    loop : true

  # - id: "cam_2"
  #   type: "WebcamSource"
  #   device_index: 1
  #   shared_memory_name: "shm_cam_2"
  #   width: 640
  #   height: 480
  #   fps: 30
  #   buffer_size: 30

pipelines:
  - name: "Office_Cam"
    source_id: "cam_0"
    enable: true
    gpu_id: 0

    detector:
      type: "YOLOWorldDetector"
      weights_path: assets/weights/yolov8l-worldv2.pt
      imgsz: 640
      iou: 0.7
      conf: 0.5
      classes: ["person", "bag", "laptop", "keyboard", "mouse"]
      
    tracker:
      type: "BYTETracker"
      track_thresh : 0.5
      match_thresh : 0.8
      track_buffer : 30
      crowd : false
      fps: 30
      classes: ["person", "bag", "laptop", "keyboard", "mouse"]

    abandoned:
      type: "abandonedObject"
      dist_threshold : 0.08
      static_dist_threshold : 0.01

      suspect_threshold_min : 15
      lost_threshold_min : 15
      unassigned_threshold_min : 5

      clean_threshold_sec : 3
      prev_clean_threshold_sec : 2

      score_threshold : 0.7
      restore_threshold : 0.7
      owner_frame_threshold : 30
      iou_threshold : 0.75
      fps: 30

  - name: "Hallway_Cam"
    source_id: "cam_1"
    enable: true
    gpu_id: 0

    detector:
      type: "YOLOWorldDetector"
      weights_path: assets/weights/yolov8l-worldv2.pt
      imgsz: 640
      iou: 0.7
      conf: 0.5
      classes: ["person", "bag", "laptop", "keyboard", "mouse"]
      
    tracker:
      type: "BYTETracker"
      track_thresh : 0.5
      match_thresh : 0.8
      track_buffer : 30
      crowd : false
      fps: 30
      classes: ["person", "bag", "laptop", "keyboard", "mouse"]

    abandoned:
      type: "abandonedObject"
      dist_threshold : 0.08
      static_dist_threshold : 0.01

      suspect_threshold_min : 15
      lost_threshold_min : 15
      unassigned_threshold_min : 5

      clean_threshold_sec : 3
      prev_clean_threshold_sec : 2

      score_threshold : 0.7
      restore_threshold : 0.7
      owner_frame_threshold : 30
      iou_threshold : 0.75
      fps: 30  

