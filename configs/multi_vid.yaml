output:
  mode: "sync"
  handlers:
    - type: "ScreenHandler"
      enable: true
      view_width: 1280
      view_height: 960
      draw_detections: true
      draw_tracks: true
      show_info: true

    - type: "FileLogHandler"
      enable: true
      output_dir: "./logs"
      filename: "tracking_data.csv"

    - type: "WebHandler"
      enable: true
      port: 5000
      view_width: 1280  
      view_height: 960
      draw_detections: true
      draw_tracks: true
      show_info: true
